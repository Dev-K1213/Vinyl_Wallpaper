<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Wallpaper</title>
<style>
  /* 1rem = 1% of the scene width. The scene is a 16:10 box that always covers the screen. */
  html { font-size: calc(max(100vw, 160vh) / 100); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #2a140a; }
  body {
    color: #fff3e4;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: 1rem; -webkit-font-smoothing: antialiased;
  }
  body.white-vinyl { --v: #e6e2d8; --groove: rgba(0,0,0,.06); --gap: rgba(0,0,0,.16); --lip: rgba(0,0,0,.14); }
  body:not(.white-vinyl) { --v: #14100d; --groove: rgba(255,255,255,.035); --gap: rgba(0,0,0,.55); --lip: rgba(255,255,255,.08); }

  .scene { position: fixed; left: 50%; top: 50%; width: 100rem; height: 62.5rem; transform: translate(-50%, -50%); }
  .scene > * { position: absolute; }

  /* ---------- Room ---------- */
  .wall {
    left: 0; top: 0; width: 100%; height: 33.6rem;
    background:
      radial-gradient(60rem 30rem at 12% 35%, rgba(255,196,150,.38), transparent 70%),
      radial-gradient(40rem 34rem at 91% 70%, rgba(255,172,96,.5), transparent 70%),
      linear-gradient(180deg, #9a6249 0%, #b07a5a 45%, #a3694b 100%);
  }
  .desk {
    left: 0; top: 33.6rem; width: 100%; height: 40rem;
    background:
      radial-gradient(45rem 16rem at 90% 0%, rgba(255,150,70,.5), transparent 70%),
      radial-gradient(30rem 12rem at 10% 4%, rgba(255,150,80,.28), transparent 70%),
      repeating-linear-gradient(180deg, rgba(0,0,0,.07) 0 .12rem, transparent .12rem .9rem),
      linear-gradient(180deg, #7a3a1a 0%, #5a2a12 18%, #3c1c0b 100%);
    box-shadow: inset 0 .15rem 0 rgba(255,190,130,.35);
  }
  .vig {
    left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.45) 100%);
  }

  /* Painting */
  .frame {
    left: 47.5rem; top: -3rem; width: 27.7rem; height: 17.3rem; background: #3a2313;
    box-shadow: 0 0 4rem rgba(255,140,70,.5), inset 0 0 0 .2rem rgba(255,255,255,.06);
  }
  .mat { position: absolute; inset: .8rem; background: #cdb9a3; box-shadow: inset 0 0 .6rem rgba(0,0,0,.25); }
  .paint {
    position: absolute; inset: 2.4rem 3rem;
    background:
      radial-gradient(circle at 28% 38%, #8d6a6e 0 7%, transparent 8%),
      radial-gradient(circle at 40% 25%, #9a7a74 0 6%, transparent 7%),
      radial-gradient(circle at 18% 60%, #5d6a60 0 8%, transparent 9%),
      radial-gradient(circle at 72% 66%, #a39a55 0 8%, transparent 9%),
      radial-gradient(circle at 82% 52%, #8e8a4a 0 6%, transparent 7%),
      radial-gradient(circle at 60% 40%, #5a4b58 0 10%, transparent 11%),
      #16130f;
  }

  /* Lamp */
  .halo { left: 70rem; top: 8rem; width: 40rem; height: 40rem;
    background: radial-gradient(circle, rgba(255,190,110,.32), transparent 65%); }
  .shade {
    left: 84.5rem; top: 16.6rem; width: 12.2rem; height: 16rem; border-radius: 6.1rem 6.1rem 1rem 1rem;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 .12rem, transparent .12rem .8rem),
      radial-gradient(ellipse at 50% 72%, #fff8e6 0, #ffd9a2 28%, #f0b076 62%, #d4965f 100%);
    box-shadow: 0 0 7rem rgba(255,170,90,.65);
  }
  .bulb { position: absolute; left: 33%; top: 45%; width: 34%; height: 40%; border-radius: 50% 50% 40% 40%;
    background: radial-gradient(ellipse at 50% 55%, #fffdf5, #ffe8bf 70%, transparent 100%); filter: blur(.25rem); }
  .neck { left: 89.2rem; top: 32.4rem; width: 2.4rem; height: 4rem;
    background: linear-gradient(90deg, #6d4e1e, #d7b25f 45%, #5e4318); }
  .lbase { left: 86.2rem; top: 36rem; width: 8rem; height: 2.6rem; border-radius: 50% 50% 10% 10% / 90% 90% 10% 10%;
    background: linear-gradient(90deg, #6d4e1e, #d7b25f 45%, #5e4318); box-shadow: 0 .8rem 1.4rem rgba(0,0,0,.5); }

  /* ---------- Album on its ledge ---------- */
  .cover {
    left: 6.1rem; top: 22.5rem; width: 24rem; height: 23.6rem; background: #17120f center / cover no-repeat;
    transform: rotate(-3deg); transform-origin: bottom left;
    box-shadow: 1rem 1.4rem 3rem rgba(0,0,0,.55);
  }
  .cover::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.1), transparent 40%); }
  .cover.in { animation: coverIn .9s ease; }
  @keyframes coverIn { from { opacity: 0; } to { opacity: 1; } }
  .ledge {
    left: 6.8rem; top: 45.4rem; width: 25.3rem; height: 2.3rem;
    background: linear-gradient(#b08c52, #6e4d24); box-shadow: 0 1rem 1.6rem rgba(0,0,0,.5), inset 0 .12rem 0 rgba(255,255,255,.25);
  }

  /* Track info on the desk below the album */
  .info { left: 6.4rem; top: 51.2rem; width: 25rem; transition: opacity .5s ease; }
  .info.hidden { opacity: 0; }
  .title { font-size: 1.7rem; font-weight: 600; line-height: 1.15; letter-spacing: -.012em; }
  .artist { margin-top: .5rem; font-size: 1.15rem; opacity: .65; }
  .bar { margin-top: 1.6rem; height: .1rem; background: rgba(255,243,228,.2); }
  .bar i { display: block; height: 100%; background: #fff3e4; opacity: .85;
    transform-origin: left; transform: scaleX(0); transition: transform 1s linear; }

  /* Lyrics on the wall */
  .lyrics {
    left: 5rem; top: 2.5rem; width: 41rem; height: 18.5rem; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
    transition: opacity 1s ease;
  }
  .lyricList { position: absolute; left: 0; right: 0; top: 0;
    transition: transform .85s cubic-bezier(.3, .7, .2, 1); will-change: transform; }
  .ll {
    font-size: 1.9rem; font-weight: 600; line-height: 1.22; letter-spacing: -.012em;
    padding: .55rem 0; opacity: .3; transform: scale(.9); transform-origin: left center;
    text-shadow: 0 0 1rem rgba(70,25,5,.55);
    transition: opacity .6s ease, transform .6s ease;
  }
  .ll.near { opacity: .5; }
  .ll.on { opacity: 1; transform: scale(1); }

  /* Clocks */
  .clock { right: 3.2rem; top: 4.2rem; font-size: 1.5rem; font-weight: 500; opacity: .75;
    text-shadow: 0 0 1rem rgba(70,25,5,.5); transition: opacity 1.2s ease; }
  .big { left: 5rem; top: 3rem; opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
    text-shadow: 0 0 2rem rgba(70,25,5,.45); }
  .bigtime { font-size: 10rem; font-weight: 200; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .bigdate { margin-top: 1rem; font-size: 2rem; opacity: .75; }
  body.idle .big { opacity: 1; }
  body.idle .clock, body.idle .lyrics, body.idle .info { opacity: 0; }

  /* ---------- Record stack (your recently played albums) ---------- */
  .stack { left: 69rem; top: 38rem; width: 30rem; height: 16rem; perspective: 70rem; }
  .sl {
    position: absolute; width: 18rem; height: 18rem; background: #3a2c25 center / cover no-repeat;
    border-bottom: .3rem solid rgba(0,0,0,.45); border-right: .2rem solid rgba(0,0,0,.35);
    transform-origin: 50% 100%; box-shadow: .6rem 1.2rem 2rem rgba(0,0,0,.5);
  }
  .s0 { left: 5.5rem; top: -2rem; transform: rotateX(58deg) rotateZ(-7deg); }
  .s1 { left: 3.4rem; top: -1.4rem; background-color: #4a3a30; transform: rotateX(58deg) rotateZ(-4deg); }
  .s2 { left: 1.4rem; top: -.8rem; background-color: #2c221c; transform: rotateX(58deg) rotateZ(-1deg); }

  /* ---------- Turntable ---------- */
  .tt { left: 34rem; top: 34rem; width: 33.6rem; height: 14.1rem; }
  .tt > * { position: absolute; }
  .ttshadow { left: 1rem; top: 9rem; width: 32rem; height: 6rem; background: rgba(0,0,0,.55); filter: blur(1.6rem); }
  .plate {
    left: 0; top: 0; width: 100%; height: 10.5rem;
    clip-path: polygon(4.2% 0, 95.8% 0, 100% 100%, 0 100%);
    background:
      linear-gradient(180deg, rgba(255,255,255,.35), transparent 8%),
      linear-gradient(#e8e1d4, #d3cab9);
  }
  .front {
    left: 0; top: 10.5rem; width: 100%; height: 3.6rem; border-radius: 0 0 .5rem .5rem;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.04) 0 .1rem, transparent .1rem .6rem),
      linear-gradient(#5b3e29, #3b2617);
    box-shadow: inset 0 .15rem 0 rgba(255,255,255,.15);
  }
  .pside {
    left: 1.1rem; top: -.3rem; width: 22.6rem; height: 9.27rem; border-radius: 50%;
    background: #b7b2a8;
    box-shadow: 0 .35rem 0 #8b877f, 0 .7rem 0 #c4bfb5, 0 1.05rem 0 #7e7a72,
                0 1.4rem 0 #b0aba1, 0 1.75rem 0 #6f6b64, 0 2.6rem 2rem rgba(0,0,0,.45);
  }
  .ptop { left: 1.5rem; top: -6.6rem; width: 21.8rem; height: 21.8rem; transform: scaleY(.41); }
  .record {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle closest-side,
        transparent 0 38%, var(--gap) 38% 39%, transparent 39% 52%,
        var(--gap) 52% 52.5%, transparent 52.5% 64%,
        var(--gap) 64% 64.5%, transparent 64.5% 76%,
        var(--gap) 76% 76.5%, transparent 76.5% 88%,
        var(--gap) 88% 88.5%, transparent 88.5%),
      repeating-radial-gradient(circle closest-side, var(--groove) 0 .1rem, transparent .1rem .4rem),
      var(--v);
    box-shadow: inset 0 0 0 .3rem var(--lip);
    animation: spin 1.8s linear infinite; /* 33 1/3 rpm */
    animation-play-state: paused;
  }
  body.playing .record { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label {
    position: absolute; inset: 32%; border-radius: 50%; background: #5b5047 center / cover no-repeat;
    box-shadow: inset 0 0 0 .2rem rgba(0,0,0,.3), 0 0 0 .3rem rgba(0,0,0,.4);
  }
  .hole { position: absolute; inset: 48.8%; border-radius: 50%; background: #14100d; }
  .sheen {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: conic-gradient(from 30deg, transparent 0 4%, rgba(255,235,210,.16) 10%, transparent 18% 54%,
      rgba(255,235,210,.1) 60%, transparent 68%);
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 37%, #000 38%);
            mask: radial-gradient(circle closest-side, transparent 0 37%, #000 38%);
  }

  .pbase {
    left: 27rem; top: -1.3rem; width: 2.8rem; height: 3.4rem; border-radius: 1rem 1rem .8rem .8rem / .9rem .9rem .6rem .6rem;
    background: linear-gradient(90deg, #1a1816, #47423d 50%, #141210); box-shadow: 0 .8rem 1rem rgba(0,0,0,.4);
  }
  .arm {
    left: 28.4rem; top: .2rem; width: 0; height: 0; z-index: 4;
    transform: rotate(132deg);                           /* resting: needle off the record */
    transition: transform 1.8s cubic-bezier(.45, .05, .25, 1);
  }
  body.playing .arm { transform: rotate(156deg); }       /* playing: needle on the grooves */
  .arm > * { position: absolute; }
  .tube { left: 0; top: -.2rem; width: 12.3rem; height: .4rem; border-radius: 1rem;
    background: linear-gradient(#f0ebe0, #8b877f); box-shadow: 0 .5rem .6rem rgba(0,0,0,.3); }
  .cw { left: -3.1rem; top: -.8rem; width: 2.9rem; height: 1.6rem; border-radius: .5rem;
    background: linear-gradient(#8c8882, #45423e); }
  .head { left: 11.7rem; top: -.75rem; width: 1.8rem; height: 1.5rem; border-radius: .25rem;
    background: linear-gradient(#b96a2c, #6b3a15); }
  .knob { left: 29.2rem; top: 7.9rem; width: 1.4rem; height: 1.4rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0d796, #8a6a2c 75%); box-shadow: 0 .3rem .6rem rgba(0,0,0,.4); }
  .led { left: 26.9rem; top: 9rem; width: .5rem; height: .5rem; border-radius: 50%; background: #2a1d17;
    transition: background .4s, box-shadow .4s; }
  body.playing .led { background: #ff8a4d; box-shadow: 0 0 1rem #ff8a4d; }

  /* ---------- Login + setup ---------- */
  #connect {
    display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10;
    font: inherit; font-size: 1.4rem; font-weight: 600; padding: .9rem 2rem; border-radius: 99px; border: 0;
    background: #fff3e4; color: #2a140a; cursor: pointer;
  }
  body.needs-login #connect { display: block; }
  body.needs-login .lyrics, body.needs-login .info, body.setup .lyrics, body.setup .info { display: none; }
  body.needs-login, body.needs-login *, body.setup, body.setup * { cursor: default; }
  body.needs-login #connect { cursor: pointer; }
  #transfer {
    display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10;
    width: min(560px, 80vw); padding: 20px; border-radius: 14px; background: rgba(20,10,5,.9);
    font-size: 16px; line-height: 1.5;
  }
  body.setup #transfer { display: block; }
  #transfer textarea {
    width: 100%; height: 150px; margin-top: 10px; padding: 10px; border-radius: 8px;
    font: 13px ui-monospace, Menlo, monospace; color: #111; background: #fff; border: 0;
  }

  @media (prefers-reduced-motion: reduce) { .record { animation-duration: 12s; } }
</style>
</head>
<body>
<div class="scene">
  <div class="wall"></div>
  <div class="desk"></div>
  <div class="vig"></div>

  <div class="frame"><div class="mat"><div class="paint"></div></div></div>
  <div class="halo"></div>
  <div class="shade"><div class="bulb"></div></div>
  <div class="neck"></div>
  <div class="lbase"></div>

  <div class="clock" id="clock"></div>
  <div class="big"><div class="bigtime" id="bigTime"></div><div class="bigdate" id="bigDate"></div></div>
  <div class="lyrics" id="lyrics"><div class="lyricList" id="lyricList"></div></div>

  <div class="cover" id="cover"></div>
  <div class="ledge"></div>
  <div class="info hidden" id="info">
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="stack" id="stack"><div class="sl s2"></div><div class="sl s1"></div><div class="sl s0"></div></div>

  <div class="tt">
    <div class="ttshadow"></div>
    <div class="plate"></div>
    <div class="front"></div>
    <div class="pside"></div>
    <div class="ptop">
      <div class="record"><div class="label" id="label"></div><div class="hole"></div></div>
      <div class="sheen"></div>
    </div>
    <div class="pbase"></div>
    <div class="knob"></div>
    <div class="led"></div>
    <div class="arm"><div class="cw"></div><div class="tube"></div><div class="head"></div></div>
  </div>
</div>

<button id="connect">Connect Spotify</button>
<div id="transfer">
  Connected. Copy this whole link and paste it as the website URL in Plash.
  <textarea id="transferUrl" readonly onclick="this.select()"></textarea>
</div>

<script>
// ---------- CONFIG ----------
const CONFIG = {
  CLIENT_ID: '7accde9c16c942b0b671362deca8a31a',
  VINYL: 'art',          // 'art' (color from album cover) | 'black' | 'white'
  SHOW_PROGRESS: true,   // thin progress line under the track
  SHOW_LYRICS: true,     // synced lyrics from LRCLIB (when the song has them)
  LYRICS_OFFSET: 0.3,    // seconds; raise if lyrics feel late, lower if early
  SHOW_CLOCK: true,      // small clock, top right
  SHOW_STACK: true,      // pile of recently played albums on the right
  IDLE_CLOCK: true,      // big clock when music is paused or stopped
  IDLE_SECONDS: 10,      // how long music must be stopped before the big clock appears
  CENSOR: true,          // replace explicit words with ***
  EXTRA_WORDS: [],       // add your own words to censor, e.g. ['heck']
  POLL_MS: 3000
};
// ----------------------------

const SCOPES = 'user-read-currently-playing user-read-playback-state';
const REDIRECT = location.origin + location.pathname;
const $ = id => document.getElementById(id);
const LS = {
  get: k => localStorage.getItem(k),
  set: (k, v) => localStorage.setItem(k, v),
  del: k => localStorage.removeItem(k)
};

document.body.classList.toggle('white-vinyl', CONFIG.VINYL === 'white');
if (!CONFIG.SHOW_PROGRESS) document.querySelector('.bar').style.display = 'none';
if (!CONFIG.SHOW_LYRICS) $('lyrics').style.display = 'none';
if (!CONFIG.SHOW_STACK) $('stack').style.display = 'none';

// ---------- Censoring ----------
const CONTAINS = ['fuck', 'shit'];
const WORDS = ['bitch', 'bastard', 'asshole', 'dick', 'cock', 'pussy', 'cunt', 'whore', 'slut',
  'piss', 'ass', 'jackass', 'dumbass', 'badass', 'nigga', 'niggas', 'nigger'];
const censorRe = new RegExp(
  '\\b\\w*(?:' + CONTAINS.join('|') + ')\\w*\\b|\\b(?:' +
  [...WORDS, ...CONFIG.EXTRA_WORDS].join('|') + ')(?:s|es|y|ing|ed|er|ers|in)?\\b', 'gi');
const censor = t => (CONFIG.CENSOR && t ? t.replace(censorRe, '*****') : t);

// ---------- Clocks ----------
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('clock').textContent = time;
  $('bigTime').textContent = time;
  $('bigDate').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 10000);
if (!CONFIG.SHOW_CLOCK) $('clock').style.display = 'none';

// Idle = nothing playing (paused or stopped) for IDLE_SECONDS.
let idleTimer = null;
function setIdle(on) {
  if (!CONFIG.IDLE_CLOCK) return;
  if (on) {
    if (!idleTimer) {
      idleTimer = setTimeout(() => document.body.classList.add('idle'), CONFIG.IDLE_SECONDS * 1000);
    }
  } else {
    clearTimeout(idleTimer);
    idleTimer = null;
    document.body.classList.remove('idle');
  }
}

// ---------- Spotify auth (PKCE, no client secret needed) ----------
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  LS.set('pkce_verifier', verifier);
  LS.set('setup', location.search.includes('setup') ? '1' : '');
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: CONFIG.CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
}

async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CONFIG.CLIENT_ID, ...params })
  });
  if (!r.ok) throw Object.assign(new Error('token request failed'), { status: r.status });
  const d = await r.json();
  LS.set('access_token', d.access_token);
  LS.set('expires_at', String(Date.now() + d.expires_in * 1000 - 60000));
  if (d.refresh_token) LS.set('refresh_token', d.refresh_token);
}

async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code')) return;
  try {
    await tokenRequest({
      grant_type: 'authorization_code',
      code: p.get('code'),
      redirect_uri: REDIRECT,
      code_verifier: LS.get('pkce_verifier')
    });
  } catch (e) { console.error(e); }
  history.replaceState({}, '', location.pathname);
  if (LS.get('setup') === '1' && LS.get('refresh_token')) {
    $('transferUrl').value = REDIRECT + '#rt=' + encodeURIComponent(LS.get('refresh_token'));
    document.body.classList.add('setup');
  }
  LS.del('setup');
}

async function getToken() {
  if (Date.now() < Number(LS.get('expires_at') || 0)) return LS.get('access_token');
  const rt = LS.get('refresh_token');
  if (!rt) return null;
  try {
    await tokenRequest({ grant_type: 'refresh_token', refresh_token: rt });
    return LS.get('access_token');
  } catch (e) {
    // Only drop the login if Spotify rejected it; keep it through network blips.
    if (e.status === 400 || e.status === 401) ['access_token', 'refresh_token', 'expires_at'].forEach(LS.del);
    return null;
  }
}

// ---------- Vinyl color from album art ----------
function extractColor(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0, 24, 24);
        const d = x.getImageData(0, 0, 24, 24).data;
        let r = 0, g = 0, b = 0, w = 0;
        for (let i = 0; i < d.length; i += 4) {
          const s = Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]);
          const wt = s * s + 1; // vivid pixels count more than grays
          r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt;
        }
        resolve([r / w, g / w, b / w]);
      } catch (e) { resolve(null); } // canvas blocked by CORS
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function applyVinyl(rgb) {
  const s = document.body.style;
  if (!rgb) { ['--v', '--groove', '--gap', '--lip'].forEach(k => s.removeProperty(k)); return; }
  const [r, g, b] = rgb.map(v => Math.round(v * .45));
  s.setProperty('--v', `rgb(${r},${g},${b})`);
  s.setProperty('--groove', 'rgba(255,255,255,.04)');
  s.setProperty('--gap', 'rgba(0,0,0,.5)');
  s.setProperty('--lip', 'rgba(255,255,255,.1)');
}

// ---------- Lyrics (LRCLIB, synced, scrolling list) ----------
const lyricsCache = new Map();
const listEl = $('lyricList');
let lyrics = [], lyricIdx = -8;

function parseLRC(text) {
  const out = [];
  for (const raw of text.split('\n')) {
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!stamps.length) continue;
    const line = censor(raw.replace(/\[[^\]]*\]/g, '').trim());
    stamps.forEach(m => out.push({ t: Number(m[1]) * 60 + Number(m[2]), text: line }));
  }
  return out.sort((a, b) => a.t - b.t);
}

async function fetchLyrics(item) {
  if (lyricsCache.has(item.id)) return lyricsCache.get(item.id);
  const base = 'https://lrclib.net/api/';
  const secs = Math.round(item.duration_ms / 1000);
  const q = { track_name: item.name, artist_name: item.artists && item.artists[0] ? item.artists[0].name : '' };
  let result = [];
  try {
    let r = await fetch(base + 'get?' + new URLSearchParams({
      ...q, album_name: item.album ? item.album.name : '', duration: secs
    }));
    let d = r.ok ? await r.json() : null;
    if (!d || !d.syncedLyrics) {
      r = await fetch(base + 'search?' + new URLSearchParams(q));
      const list = r.ok ? await r.json() : [];
      d = list.find(x => x.syncedLyrics && Math.abs(x.duration - secs) < 5) || list.find(x => x.syncedLyrics);
    }
    if (d && d.syncedLyrics) result = parseLRC(d.syncedLyrics);
    lyricsCache.set(item.id, result);
  } catch (e) { /* network error: don't cache, show nothing */ }
  return result;
}

// Mark the active line and slide the whole list so it sits in the middle.
function focusLine(i, snap) {
  const els = listEl.children;
  if (!els.length) return;
  for (let k = 0; k < els.length; k++) {
    const d = Math.abs(k - i);
    els[k].className = 'll' + (d === 0 ? ' on' : d === 1 ? ' near' : '');
  }
  const target = els[Math.max(i, 0)];
  const y = $('lyrics').clientHeight / 2 - (target.offsetTop + target.offsetHeight / 2);
  if (snap) listEl.style.transition = 'none';
  listEl.style.transform = `translateY(${y}px)`;
  if (snap) { void listEl.offsetWidth; listEl.style.transition = ''; }
}

function buildList() {
  listEl.innerHTML = '';
  lyrics.forEach(l => {
    const d = document.createElement('div');
    d.className = 'll';
    d.textContent = l.text || '\u266A';
    listEl.appendChild(d);
  });
  focusLine(-1, true);
}

function lyricTick() {
  if (!CONFIG.SHOW_LYRICS || !lyrics.length) return;
  const ms = cur.playing ? cur.progress + (performance.now() - cur.stamp) : cur.progress;
  const p = ms / 1000 + CONFIG.LYRICS_OFFSET;
  let i = -1;
  for (let k = 0; k < lyrics.length && lyrics[k].t <= p; k++) i = k;
  if (i === lyricIdx) return;
  lyricIdx = i;
  focusLine(i, false);
}
setInterval(lyricTick, 250);
window.addEventListener('resize', () => focusLine(lyricIdx, true));

// ---------- Rendering ----------
let lastArt = null;
const albumHistory = [];
const cur = { id: null, progress: 0, duration: 1, stamp: 0, playing: false };

function renderStack() {
  ['s0', 's1', 's2'].forEach((c, i) => {
    const el = document.querySelector('.' + c);
    el.style.backgroundImage = albumHistory[i] ? `url(${albumHistory[i]})` : 'none';
  });
}

function setArt(url) {
  if (url === lastArt) return;
  if (lastArt) {
    const j = albumHistory.indexOf(lastArt);
    if (j > -1) albumHistory.splice(j, 1);
    albumHistory.unshift(lastArt);
  }
  const k = albumHistory.indexOf(url);
  if (k > -1) albumHistory.splice(k, 1);
  albumHistory.length = Math.min(albumHistory.length, 3);
  lastArt = url;
  renderStack();

  const cover = $('cover');
  cover.style.backgroundImage = url ? `url(${url})` : 'none';
  cover.classList.remove('in'); void cover.offsetWidth; cover.classList.add('in');
  $('label').style.backgroundImage = url ? `url(${url})` : 'none';
  if (CONFIG.VINYL === 'art') {
    if (url) extractColor(url).then(c => { if (lastArt === url) applyVinyl(c); });
    else applyVinyl(null);
  }
}

function render(data) {
  const item = data && data.item;
  document.body.classList.remove('needs-login');
  if (!item) {
    cur.playing = false;
    document.body.classList.remove('playing');
    $('info').classList.add('hidden');
    setIdle(true);
    return;
  }
  const art = (item.album && item.album.images && item.album.images[0] && item.album.images[0].url)
    || (item.images && item.images[0] && item.images[0].url) || null;
  const artist = item.artists ? item.artists.map(a => a.name).join(', ')
    : (item.show && item.show.name) || '';

  const changed = item.id !== cur.id;
  cur.id = item.id;
  cur.progress = data.progress_ms || 0;
  cur.duration = item.duration_ms || 1;
  cur.stamp = performance.now();
  cur.playing = !!data.is_playing;

  setArt(art);
  document.body.classList.toggle('playing', cur.playing);
  setIdle(!cur.playing); // paused counts as idle too

  if (changed) {
    $('info').classList.add('hidden');
    $('fill').style.transition = 'none';
    setTimeout(() => {
      $('title').textContent = censor(item.name);
      $('artist').textContent = censor(artist);
      $('info').classList.remove('hidden');
    }, $('title').textContent ? 350 : 0);
    tick();
    requestAnimationFrame(() => requestAnimationFrame(() => { $('fill').style.transition = ''; }));

    lyrics = []; lyricIdx = -8; buildList();
    if (CONFIG.SHOW_LYRICS && item.type === 'track') {
      fetchLyrics(item).then(l => {
        if (cur.id === item.id) { lyrics = l; lyricIdx = -8; buildList(); lyricTick(); }
      });
    }
  } else {
    $('info').classList.remove('hidden');
  }
}

function tick() {
  const p = cur.playing ? cur.progress + (performance.now() - cur.stamp) : cur.progress;
  $('fill').style.transform = `scaleX(${Math.min(1, p / cur.duration)})`;
}
setInterval(tick, 1000);

// ---------- Polling ----------
async function poll() {
  let delay = CONFIG.POLL_MS;
  try {
    const token = await getToken();
    if (!token) {
      document.body.classList.add('needs-login');
      document.body.classList.remove('playing');
      setIdle(false);
    } else {
      const r = await fetch(
        'https://api.spotify.com/v1/me/player/currently-playing?additional_types=track,episode',
        { headers: { Authorization: 'Bearer ' + token } }
      );
      if (r.status === 200) render(await r.json());
      else if (r.status === 204) render(null);
      else if (r.status === 401) LS.set('expires_at', '0');
      else if (r.status === 429) delay = (Number(r.headers.get('Retry-After')) || 10) * 1000;
    }
  } catch (e) { /* offline or transient error: try again next tick */ }
  setTimeout(poll, delay);
}

// Token handed over from a normal browser (see ?setup flow). Only used if this page isn't logged in yet.
const hashRt = location.hash.match(/rt=([^&]+)/);
if (hashRt) {
  if (!LS.get('refresh_token')) {
    LS.set('refresh_token', decodeURIComponent(hashRt[1]));
    LS.set('expires_at', '0');
  }
  history.replaceState({}, '', location.pathname);
}

$('connect').addEventListener('click', login);
handleRedirect().then(poll);
</script>
</body>
</html>
