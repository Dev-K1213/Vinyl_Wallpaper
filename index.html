<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Wallpaper</title>
<style>
  :root { --h: min(76vh, 44vw); --ink: #efe9de; }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: #0b0a09; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.light { background: #e9e4d9; --ink: #1b1814; }
  body.white-vinyl { --v: #e6e2d8; --groove: rgba(0,0,0,.06); --gap: rgba(0,0,0,.16); --lip: rgba(0,0,0,.14); }
  body:not(.white-vinyl) { --v: #0e0d0c; --groove: rgba(255,255,255,.03); --gap: rgba(0,0,0,.55); --lip: rgba(255,255,255,.07); }

  .bg {
    position: fixed; inset: -14%; background-size: cover; background-position: center;
    filter: blur(90px) saturate(1.2) brightness(.42);
    opacity: 0; transition: opacity 1.4s ease;
  }
  .bg.on { opacity: 1; }
  body.dark .bg, body.light .bg { display: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 40% 50%, transparent 25%, rgba(0,0,0,.6) 100%);
  }
  body.light .vignette { display: none; }

  /* Small clock (while playing) and big clock (when idle) */
  .clock {
    position: fixed; top: 4vh; left: 3vw; z-index: 2;
    font-size: clamp(14px, 1.3vw, 24px); font-weight: 500; letter-spacing: .01em; opacity: .5;
    transition: opacity 1.2s ease;
  }
  .big {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .bigtime {
    font-size: clamp(80px, 22vw, 420px); font-weight: 200; line-height: 1;
    letter-spacing: -.04em; font-variant-numeric: tabular-nums;
  }
  .bigdate { margin-top: 2vh; font-size: clamp(16px, 2vw, 36px); font-weight: 400; opacity: .5; }
  body.idle .big { opacity: 1; }
  body.idle .clock { opacity: 0; }

  .stage {
    position: relative; z-index: 1; height: 100%;
    display: flex; align-items: center; justify-content: center; gap: 4vw;
    transition: opacity 1.2s ease;
  }
  body.idle .stage { opacity: 0; }

  /* ---------- Turntable ---------- */
  .deck {
    position: relative; flex: none; width: calc(var(--h) * 1.3); height: var(--h);
    border-radius: calc(var(--h) * .035);
    background:
      repeating-linear-gradient(92deg, rgba(255,255,255,.02) 0 1px, transparent 1px 5px,
        rgba(0,0,0,.06) 5px 6px, transparent 6px 13px),
      linear-gradient(160deg, #3b2b1f, #251912 55%, #1a110b);
    box-shadow: 0 5vh 9vh rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.45);
  }
  .platter {
    position: absolute; left: calc(var(--h) * .05); top: calc(var(--h) * .05);
    width: calc(var(--h) * .9); height: calc(var(--h) * .9); border-radius: 50%;
    background: conic-gradient(#8c8882, #4d4a45, #a09c95, #44413d, #8c8882);
    box-shadow: 0 .8vh 2vh rgba(0,0,0,.6), inset 0 0 0 calc(var(--h) * .006) rgba(0,0,0,.5);
  }
  .disc {
    position: absolute; left: calc(var(--h) * .07); top: calc(var(--h) * .07);
    width: calc(var(--h) * .86); height: calc(var(--h) * .86);
  }
  .record {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle closest-side,
        transparent 0 38%, var(--gap) 38% 39%, transparent 39% 52%,
        var(--gap) 52% 52.5%, transparent 52.5% 64%,
        var(--gap) 64% 64.5%, transparent 64.5% 76%,
        var(--gap) 76% 76.5%, transparent 76.5% 88%,
        var(--gap) 88% 88.5%, transparent 88.5%),
      repeating-radial-gradient(circle closest-side, var(--groove) 0 .6px, transparent .6px 2.4px),
      var(--v);
    box-shadow: inset 0 0 0 calc(var(--h) * .004) var(--lip), 0 .4vh 1.2vh rgba(0,0,0,.5);
    animation: spin 1.8s linear infinite; /* 33 1/3 rpm */
    animation-play-state: paused;
  }
  body.playing .record { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .label {
    position: absolute; inset: 32%; border-radius: 50%;
    background: #5b5047 center / cover no-repeat;
    box-shadow: inset 0 0 0 .3vmin rgba(0,0,0,.3), 0 0 0 .5vmin rgba(0,0,0,.4);
    transition: background-image .6s;
  }
  .hole { position: absolute; inset: 48.8%; border-radius: 50%; background: #0b0a09;
    box-shadow: 0 0 0 .2vmin rgba(255,255,255,.12); }
  .sheen {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 30deg,
      transparent 0 4%, rgba(255,255,255,.13) 10%, transparent 18% 54%,
      rgba(255,255,255,.08) 60%, transparent 68%);
    mix-blend-mode: screen;
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 37%, #000 38%);
            mask: radial-gradient(circle closest-side, transparent 0 37%, #000 38%);
  }

  /* Tonearm: pivot sits top right of the deck. Tune the two rotate() angles if the needle lands off. */
  .armwrap { position: absolute; left: calc(var(--h) * 1.12); top: calc(var(--h) * .2); width: 0; height: 0; }
  .base {
    position: absolute; width: calc(var(--h) * .11); height: calc(var(--h) * .11);
    left: calc(var(--h) * -.055); top: calc(var(--h) * -.055); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7b766e, #2a2724 70%);
    box-shadow: 0 .7vh 1.6vh rgba(0,0,0,.55), inset 0 0 0 calc(var(--h) * .004) rgba(255,255,255,.12);
  }
  .arm {
    position: absolute; right: 0; top: calc(var(--h) * -.0065);
    width: calc(var(--h) * .386); height: calc(var(--h) * .013); border-radius: 99px;
    background: linear-gradient(#e6e1d6, #8f8b83);
    box-shadow: 0 .7vh 1.4vh rgba(0,0,0,.5);
    transform-origin: 100% 50%;
    transform: rotate(-67deg);                       /* resting: needle off the record */
    transition: transform 1.8s cubic-bezier(.45, .05, .25, 1);
  }
  body.playing .arm { transform: rotate(-10.5deg); } /* playing: needle on the grooves */
  .arm::before { /* headshell */
    content: ""; position: absolute; left: calc(var(--h) * -.06); top: calc(var(--h) * -.0125);
    width: calc(var(--h) * .075); height: calc(var(--h) * .038);
    background: linear-gradient(#2c2926, #12100e); border-radius: calc(var(--h) * .006);
    transform: rotate(14deg); transform-origin: right center;
  }
  .arm::after { /* counterweight */
    content: ""; position: absolute; right: calc(var(--h) * -.075); top: calc(var(--h) * -.0125);
    width: calc(var(--h) * .07); height: calc(var(--h) * .038);
    background: linear-gradient(#4a4642, #1c1a18); border-radius: calc(var(--h) * .01);
  }
  .cap {
    position: absolute; width: calc(var(--h) * .05); height: calc(var(--h) * .05);
    left: calc(var(--h) * -.025); top: calc(var(--h) * -.025); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d9d4c9, #6c685f 75%);
    box-shadow: 0 .3vh .8vh rgba(0,0,0,.5);
  }

  /* Controls */
  .knob {
    position: absolute; left: calc(var(--h) * 1.055); top: calc(var(--h) * .675);
    width: calc(var(--h) * .13); height: calc(var(--h) * .13); border-radius: 50%;
    background: conic-gradient(#b9b4aa, #6d6962, #c9c4ba, #5f5b55, #b9b4aa);
    box-shadow: 0 .6vh 1.4vh rgba(0,0,0,.55), inset 0 0 0 calc(var(--h) * .005) rgba(0,0,0,.35);
    transition: transform 1.2s cubic-bezier(.4, 0, .2, 1);
  }
  .knob::after {
    content: ""; position: absolute; left: 47.5%; top: 9%; width: 5%; height: 26%;
    border-radius: 2px; background: #1a1816;
  }
  body.playing .knob { transform: rotate(55deg); }
  .led {
    position: absolute; left: calc(var(--h) * 1.108); top: calc(var(--h) * .588);
    width: calc(var(--h) * .024); height: calc(var(--h) * .024); border-radius: 50%;
    background: #3a1512; transition: background .4s, box-shadow .4s;
  }
  body.playing .led { background: #ff6a45; box-shadow: 0 0 1.6vh #ff6a45; }
  .spd {
    position: absolute; top: calc(var(--h) * .8675);
    width: calc(var(--h) * .065); height: calc(var(--h) * .065); border-radius: 50%;
    background: linear-gradient(#3d3a36, #1c1a18); color: #8d877c;
    font-size: calc(var(--h) * .024); font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 .4vh 1vh rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .spd.a { left: calc(var(--h) * 1.0175); color: #ffb86b; }
  .spd.b { left: calc(var(--h) * 1.1575); }

  /* ---------- Right column ---------- */
  .side {
    width: 26vw; height: var(--h);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .lyrics {
    flex: 1; position: relative; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
  }
  .lyricList {
    position: absolute; left: 0; right: 0; top: 0; padding-right: 1vw;
    transition: transform .85s cubic-bezier(.3, .7, .2, 1); will-change: transform;
  }
  .ll {
    font-size: clamp(17px, 1.9vw, 36px); font-weight: 600; line-height: 1.22; letter-spacing: -.012em;
    padding: 1.1vh 0; opacity: .2; transform: scale(.9); transform-origin: left center;
    transition: opacity .6s ease, transform .6s ease;
  }
  .ll.near { opacity: .38; }
  .ll.on { opacity: 1; transform: scale(1); }

  .info { margin-bottom: 1vh; transition: opacity .5s ease; }
  .info.hidden { opacity: 0; }
  .title { font-size: clamp(16px, 1.7vw, 32px); font-weight: 500; line-height: 1.15; letter-spacing: -.015em; }
  .artist { margin-top: .8vh; font-size: clamp(12px, 1.1vw, 20px); opacity: .55; }
  .bar { margin-top: 3vh; height: 1px; background: color-mix(in srgb, var(--ink) 18%, transparent); }
  .bar i { display: block; height: 100%; background: var(--ink); opacity: .8;
    transform-origin: left; transform: scaleX(0); transition: transform 1s linear; }

  /* Login + setup states */
  #connect {
    display: none; font: inherit; font-size: 18px; font-weight: 500;
    padding: 12px 26px; border-radius: 999px; border: 0;
    background: var(--ink); color: #0b0a09; cursor: pointer;
  }
  body.needs-login #connect { display: block; }
  body.needs-login .side, body.setup .side, body.needs-login .deck, body.setup .deck { display: none; }
  body.needs-login, body.needs-login *, body.setup, body.setup * { cursor: default; }
  body.needs-login #connect { cursor: pointer; }

  #transfer { display: none; max-width: 34vw; font-size: 16px; line-height: 1.5; }
  body.setup #transfer { display: block; }
  #transfer textarea {
    width: 100%; height: 150px; margin-top: 10px; padding: 10px; border-radius: 8px;
    font: 13px ui-monospace, Menlo, monospace; color: #111; background: #fff; border: 0;
  }

  @media (prefers-reduced-motion: reduce) { .record { animation-duration: 12s; } }
</style>
</head>
<body>
  <div class="bg" id="bg0"></div>
  <div class="bg" id="bg1"></div>
  <div class="vignette"></div>
  <div class="clock" id="clock"></div>
  <div class="big"><div class="bigtime" id="bigTime"></div><div class="bigdate" id="bigDate"></div></div>

  <div class="stage">
    <div class="deck">
      <div class="platter"></div>
      <div class="disc">
        <div class="record">
          <div class="label" id="label"></div>
          <div class="hole"></div>
        </div>
        <div class="sheen"></div>
      </div>

      <div class="led"></div>
      <div class="knob"></div>
      <div class="spd a">33</div>
      <div class="spd b">45</div>

      <div class="armwrap">
        <div class="base"></div>
        <div class="arm"></div>
        <div class="cap"></div>
      </div>
    </div>

    <div class="side">
      <div class="lyrics" id="lyrics"><div class="lyricList" id="lyricList"></div></div>
      <div class="info hidden" id="info">
        <div class="title" id="title"></div>
        <div class="artist" id="artist"></div>
        <div class="bar"><i id="fill"></i></div>
      </div>
    </div>

    <button id="connect">Connect Spotify</button>
    <div id="transfer">
      Connected. Copy this whole link and paste it as the website URL in Plash.
      <textarea id="transferUrl" readonly onclick="this.select()"></textarea>
    </div>
  </div>

<script>
// ---------- CONFIG ----------
const CONFIG = {
  CLIENT_ID: '7accde9c16c942b0b671362deca8a31a',
  VINYL: 'art',          // 'art' (color from album cover) | 'black' | 'white'
  BACKGROUND: 'art',     // 'art' (blurred album art) | 'dark' | 'light'
  SHOW_PROGRESS: true,   // thin progress line under the track
  SHOW_LYRICS: true,     // synced lyrics from LRCLIB (when the song has them)
  LYRICS_OFFSET: 0.3,    // seconds; raise if lyrics feel late, lower if early
  SHOW_CLOCK: false,      // small clock, top left
  IDLE_CLOCK: true,      // big clock when music is paused or stopped
  IDLE_SECONDS: 10,      // how long music must be stopped before the big clock appears
  CENSOR: true,          // replace explicit words with ***
  EXTRA_WORDS: [],       // add your own words to censor, e.g. ['heck']
  POLL_MS: 3000
};
// ----------------------------

const SCOPES = 'user-read-currently-playing user-read-playback-state';
const REDIRECT = location.origin + location.pathname;
const $ = id => document.getElementById(id);
const LS = {
  get: k => localStorage.getItem(k),
  set: (k, v) => localStorage.setItem(k, v),
  del: k => localStorage.removeItem(k)
};

document.body.classList.add(CONFIG.BACKGROUND);
document.body.classList.toggle('white-vinyl', CONFIG.VINYL === 'white');
if (!CONFIG.SHOW_PROGRESS) document.querySelector('.bar').style.display = 'none';
if (!CONFIG.SHOW_LYRICS) $('lyrics').style.display = 'none';

// ---------- Censoring ----------
const CONTAINS = ['fuck', 'shit'];
const WORDS = ['bitch', 'bastard', 'asshole', 'dick', 'cock', 'pussy', 'cunt', 'whore', 'slut',
  'piss', 'ass', 'jackass', 'dumbass', 'badass', 'nigga', 'nigger'];
const censorRe = new RegExp(
  '\\b\\w*(?:' + CONTAINS.join('|') + ')\\w*\\b|\\b(?:' +
  [...WORDS, ...CONFIG.EXTRA_WORDS].join('|') + ')(?:s|es|y|ing|ed|er|ers|in)?\\b', 'gi');
const censor = t => (CONFIG.CENSOR && t ? t.replace(censorRe, '***') : t);

// ---------- Clocks ----------
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('clock').textContent = time;
  $('bigTime').textContent = time;
  $('bigDate').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 10000);
if (!CONFIG.SHOW_CLOCK) $('clock').style.display = 'none';

// Idle = nothing playing (paused or stopped) for IDLE_SECONDS.
let idleTimer = null;
function setIdle(on) {
  if (!CONFIG.IDLE_CLOCK) return;
  if (on) {
    if (!idleTimer) {
      idleTimer = setTimeout(() => document.body.classList.add('idle'), CONFIG.IDLE_SECONDS * 1000);
    }
  } else {
    clearTimeout(idleTimer);
    idleTimer = null;
    document.body.classList.remove('idle');
  }
}

// ---------- Spotify auth (PKCE, no client secret needed) ----------
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  LS.set('pkce_verifier', verifier);
  LS.set('setup', location.search.includes('setup') ? '1' : '');
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: CONFIG.CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
}

async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CONFIG.CLIENT_ID, ...params })
  });
  if (!r.ok) throw Object.assign(new Error('token request failed'), { status: r.status });
  const d = await r.json();
  LS.set('access_token', d.access_token);
  LS.set('expires_at', String(Date.now() + d.expires_in * 1000 - 60000));
  if (d.refresh_token) LS.set('refresh_token', d.refresh_token);
}

async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code')) return;
  try {
    await tokenRequest({
      grant_type: 'authorization_code',
      code: p.get('code'),
      redirect_uri: REDIRECT,
      code_verifier: LS.get('pkce_verifier')
    });
  } catch (e) { console.error(e); }
  history.replaceState({}, '', location.pathname);
  if (LS.get('setup') === '1' && LS.get('refresh_token')) {
    $('transferUrl').value = REDIRECT + '#rt=' + encodeURIComponent(LS.get('refresh_token'));
    document.body.classList.add('setup');
  }
  LS.del('setup');
}

async function getToken() {
  if (Date.now() < Number(LS.get('expires_at') || 0)) return LS.get('access_token');
  const rt = LS.get('refresh_token');
  if (!rt) return null;
  try {
    await tokenRequest({ grant_type: 'refresh_token', refresh_token: rt });
    return LS.get('access_token');
  } catch (e) {
    // Only drop the login if Spotify rejected it; keep it through network blips.
    if (e.status === 400 || e.status === 401) ['access_token', 'refresh_token', 'expires_at'].forEach(LS.del);
    return null;
  }
}

// ---------- Vinyl color from album art ----------
function extractColor(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0, 24, 24);
        const d = x.getImageData(0, 0, 24, 24).data;
        let r = 0, g = 0, b = 0, w = 0;
        for (let i = 0; i < d.length; i += 4) {
          const s = Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]);
          const wt = s * s + 1; // vivid pixels count more than grays
          r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt;
        }
        resolve([r / w, g / w, b / w]);
      } catch (e) { resolve(null); } // canvas blocked by CORS
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function applyVinyl(rgb) {
  const s = document.body.style;
  if (!rgb) { ['--v', '--groove', '--gap', '--lip'].forEach(k => s.removeProperty(k)); return; }
  const [r, g, b] = rgb.map(v => Math.round(v * .45));
  s.setProperty('--v', `rgb(${r},${g},${b})`);
  s.setProperty('--groove', 'rgba(255,255,255,.035)');
  s.setProperty('--gap', 'rgba(0,0,0,.5)');
  s.setProperty('--lip', 'rgba(255,255,255,.09)');
}

// ---------- Lyrics (LRCLIB, synced, scrolling list) ----------
const lyricsCache = new Map();
const listEl = $('lyricList');
let lyrics = [], lyricIdx = -8;

function parseLRC(text) {
  const out = [];
  for (const raw of text.split('\n')) {
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!stamps.length) continue;
    const line = censor(raw.replace(/\[[^\]]*\]/g, '').trim());
    stamps.forEach(m => out.push({ t: Number(m[1]) * 60 + Number(m[2]), text: line }));
  }
  return out.sort((a, b) => a.t - b.t);
}

async function fetchLyrics(item) {
  if (lyricsCache.has(item.id)) return lyricsCache.get(item.id);
  const base = 'https://lrclib.net/api/';
  const secs = Math.round(item.duration_ms / 1000);
  const q = { track_name: item.name, artist_name: item.artists && item.artists[0] ? item.artists[0].name : '' };
  let result = [];
  try {
    let r = await fetch(base + 'get?' + new URLSearchParams({
      ...q, album_name: item.album ? item.album.name : '', duration: secs
    }));
    let d = r.ok ? await r.json() : null;
    if (!d || !d.syncedLyrics) {
      r = await fetch(base + 'search?' + new URLSearchParams(q));
      const list = r.ok ? await r.json() : [];
      d = list.find(x => x.syncedLyrics && Math.abs(x.duration - secs) < 5) || list.find(x => x.syncedLyrics);
    }
    if (d && d.syncedLyrics) result = parseLRC(d.syncedLyrics);
    lyricsCache.set(item.id, result);
  } catch (e) { /* network error: don't cache, show nothing */ }
  return result;
}

// Mark the active line and slide the whole list so it sits in the middle.
function focusLine(i, snap) {
  const els = listEl.children;
  if (!els.length) return;
  for (let k = 0; k < els.length; k++) {
    const d = Math.abs(k - i);
    els[k].className = 'll' + (d === 0 ? ' on' : d === 1 ? ' near' : '');
  }
  const target = els[Math.max(i, 0)];
  const y = $('lyrics').clientHeight / 2 - (target.offsetTop + target.offsetHeight / 2);
  if (snap) listEl.style.transition = 'none';
  listEl.style.transform = `translateY(${y}px)`;
  if (snap) { void listEl.offsetWidth; listEl.style.transition = ''; }
}

function buildList() {
  listEl.innerHTML = '';
  lyrics.forEach(l => {
    const d = document.createElement('div');
    d.className = 'll';
    d.textContent = l.text || '\u266A';
    listEl.appendChild(d);
  });
  focusLine(-1, true);
}

function lyricTick() {
  if (!CONFIG.SHOW_LYRICS || !lyrics.length) return;
  const ms = cur.playing ? cur.progress + (performance.now() - cur.stamp) : cur.progress;
  const p = ms / 1000 + CONFIG.LYRICS_OFFSET;
  let i = -1;
  for (let k = 0; k < lyrics.length && lyrics[k].t <= p; k++) i = k;
  if (i === lyricIdx) return;
  lyricIdx = i;
  focusLine(i, false);
}
setInterval(lyricTick, 250);
window.addEventListener('resize', () => focusLine(lyricIdx, true));

// ---------- Rendering ----------
let lastArt = null, layer = 0;
const cur = { id: null, progress: 0, duration: 1, stamp: 0, playing: false };

function setArt(url) {
  if (url === lastArt) return;
  lastArt = url;
  const layers = [$('bg0'), $('bg1')];
  layer ^= 1;
  layers[layer].style.backgroundImage = url ? `url(${url})` : 'none';
  layers[layer].classList.add('on');
  layers[layer ^ 1].classList.remove('on');
  $('label').style.backgroundImage = url ? `url(${url})` : 'none';
  if (CONFIG.VINYL === 'art') {
    if (url) extractColor(url).then(c => { if (lastArt === url) applyVinyl(c); });
    else applyVinyl(null);
  }
}

function render(data) {
  const item = data && data.item;
  document.body.classList.remove('needs-login');
  if (!item) {
    cur.playing = false;
    document.body.classList.remove('playing');
    $('info').classList.add('hidden');
    setIdle(true);
    return;
  }
  const art = (item.album && item.album.images && item.album.images[0] && item.album.images[0].url)
    || (item.images && item.images[0] && item.images[0].url) || null;
  const artist = item.artists ? item.artists.map(a => a.name).join(', ')
    : (item.show && item.show.name) || '';

  const changed = item.id !== cur.id;
  cur.id = item.id;
  cur.progress = data.progress_ms || 0;
  cur.duration = item.duration_ms || 1;
  cur.stamp = performance.now();
  cur.playing = !!data.is_playing;

  setArt(art);
  document.body.classList.toggle('playing', cur.playing);
  setIdle(!cur.playing); // paused counts as idle too

  if (changed) {
    $('info').classList.add('hidden');
    $('fill').style.transition = 'none';
    setTimeout(() => {
      $('title').textContent = censor(item.name);
      $('artist').textContent = censor(artist);
      $('info').classList.remove('hidden');
    }, $('title').textContent ? 350 : 0);
    tick();
    requestAnimationFrame(() => requestAnimationFrame(() => { $('fill').style.transition = ''; }));

    lyrics = []; lyricIdx = -8; buildList();
    if (CONFIG.SHOW_LYRICS && item.type === 'track') {
      fetchLyrics(item).then(l => {
        if (cur.id === item.id) { lyrics = l; lyricIdx = -8; buildList(); lyricTick(); }
      });
    }
  } else {
    $('info').classList.remove('hidden');
  }
}

function tick() {
  const p = cur.playing ? cur.progress + (performance.now() - cur.stamp) : cur.progress;
  $('fill').style.transform = `scaleX(${Math.min(1, p / cur.duration)})`;
}
setInterval(tick, 1000);

// ---------- Polling ----------
async function poll() {
  let delay = CONFIG.POLL_MS;
  try {
    const token = await getToken();
    if (!token) {
      document.body.classList.add('needs-login');
      document.body.classList.remove('playing');
      setIdle(false);
    } else {
      const r = await fetch(
        'https://api.spotify.com/v1/me/player/currently-playing?additional_types=track,episode',
        { headers: { Authorization: 'Bearer ' + token } }
      );
      if (r.status === 200) render(await r.json());
      else if (r.status === 204) render(null);
      else if (r.status === 401) LS.set('expires_at', '0');
      else if (r.status === 429) delay = (Number(r.headers.get('Retry-After')) || 10) * 1000;
    }
  } catch (e) { /* offline or transient error: try again next tick */ }
  setTimeout(poll, delay);
}

// Token handed over from a normal browser (see ?setup flow). Only used if this page isn't logged in yet.
const hashRt = location.hash.match(/rt=([^&]+)/);
if (hashRt) {
  if (!LS.get('refresh_token')) {
    LS.set('refresh_token', decodeURIComponent(hashRt[1]));
    LS.set('expires_at', '0');
  }
  history.replaceState({}, '', location.pathname);
}

$('connect').addEventListener('click', login);
handleRedirect().then(poll);
</script>
</body>
